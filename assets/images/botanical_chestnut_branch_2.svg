<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" fill="none" stroke="currentColor">
  <!-- Ramo de Castanheiro com Folhas e Ouriço Nobre -->
  <g stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8">
    <!-- Caule curvo -->
    <path d="M20 180 C 70 160, 130 140, 220 70" />
    
    <!-- Folha Superior Direita -->
    <path d="M160 110 C 185 85, 215 70, 230 40 C 205 50, 185 75, 160 110" />
    <path d="M175 90 C 190 75, 205 65, 215 50" />

    <!-- Folha Esquerda -->
    <path d="M110 135 C 75 120, 50 95, 30 65 C 55 80, 85 110, 110 135" />
    <path d="M85 115 C 65 95, 50 85, 40 75" />

    <!-- Ouriço da Castanha Estilizado com Espinhos Radiais Discretos -->
    <circle cx="140" cy="140" r="18" fill="none" stroke-width="1.2" stroke-dasharray="2,2" />
    <!-- Castanhas no interior do ouriço -->
    <path d="M133 147 C 131 138, 136 132, 140 130 C 144 132, 149 138, 147 147 Z" fill="none" stroke-width="1.3" />
    <path d="M136 147 C 137 148, 143 148, 144 147" stroke-width="1" />
    
    <!-- Espinhos do ouriço -->
    <path d="M140 120 L 140 112" />
    <path d="M154 126 L 160 120" />
    <path d="M160 140 L 168 140" />
    <path d="M154 154 L 160 160" />
    <path d="M140 160 L 140 168" />
    <path d="M126 154 L 120 160" />
    <path d="M120 140 L 112 140" />
    <path d="M126 126 L 120 120" />
  </g>
</svg>
