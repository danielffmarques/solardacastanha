<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">
  <!-- Símbolo Botânico da Castanha (Ouriço & Folha) -->
  <g transform="translate(10, 14)">
    <!-- Folha estilizada em traço fino -->
    <path d="M26 48 C 24 32, 16 18, 28 4 C 36 16, 32 32, 26 48 Z" stroke="#5C3A21" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="#FAF6F0"/>
    <path d="M26 12 C 24 20, 25 36, 26 48" stroke="#B87326" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M24 24 C 20 22, 18 24, 18 26" stroke="#B87326" stroke-width="1.1" stroke-linecap="round"/>
    <path d="M27 28 C 30 26, 33 28, 33 30" stroke="#B87326" stroke-width="1.1" stroke-linecap="round"/>
    <!-- Ouriço com castanha nobre -->
    <circle cx="42" cy="38" r="11" stroke="#5C3A21" stroke-width="1.6" stroke-dasharray="2,2" fill="#FAF6F0"/>
    <path d="M38 43 C 36 37, 40 33, 42 32 C 44 33, 48 37, 46 43 Z" fill="#B87326" stroke="#5C3A21" stroke-width="1.2"/>
  </g>

  <!-- Tipografia do Alojamento: Nome e Ancoragem Geográfica -->
  <g transform="translate(74, 0)">
    <!-- Título Principal com Tipografia Clássica de Hospitalidade -->
    <text x="0" y="38" font-family="'Cormorant Garamond', Georgia, serif" font-size="28" font-weight="600" fill="#241C17" letter-spacing="0.02em">
      Solar da Castanha
    </text>
    <!-- Ancoragem Geográfica Limpa (Vila e Distrito - Regra 10 dos Padrões Bruto) -->
    <text x="1" y="56" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#7A685D" letter-spacing="0.08em">
      MANTEIGAS, GUARDA
    </text>
  </g>
</svg>
